; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:digispark-tiny]
platform = atmelavr
board = digispark-tiny
framework = arduino
targets = buildprog, compiledb
extra_scripts = extra_scripts.py
build_flags = -std=gnu++1z -DMODE_RUN

[env:digispark-record]
platform = atmelavr
board = digispark-tiny
framework = arduino
targets = buildprog, compiledb
extra_scripts = extra_scripts.py
build_flags = -std=gnu++1z -DMODE_RECORD

[env:digispark-retrieve]
platform = atmelavr
board = digispark-tiny
framework = arduino
targets = buildprog, compiledb
extra_scripts = extra_scripts.py
lib_deps = DigisparkCDC
build_flags = -std=gnu++1z -DMODE_RETRIEVE

[env:digispark-run]
platform = atmelavr
board = digispark-tiny
framework = arduino
targets = buildprog, compiledb
extra_scripts = extra_scripts.py
build_flags = -std=gnu++1z -DMODE_RUN

[env:digispark-run-debug]
platform = atmelavr
board = digispark-tiny
framework = arduino
targets = buildprog, compiledb
extra_scripts = extra_scripts.py
lib_deps = DigisparkCDC
build_flags = -std=gnu++1z -DMODE_RUN -DDEBUG_PRINT=1